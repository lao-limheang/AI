<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Interface</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-2xl bg-slate-900 rounded-2xl shadow-2xl border border-slate-800 p-6">
        <h1 class="text-2xl font-bold text-blue-400 mb-4 text-center">Grok AI Assistant</h1>
        
        <!-- Chat Area -->
        <div id="chat-box" class="h-96 overflow-y-auto mb-4 p-4 bg-slate-950 rounded-lg border border-slate-800 space-y-4">
            <p class="text-gray-500 text-sm text-center">ចាប់ផ្តើមសន្ទនាជាមួយ AI...</p>
        </div>

        <!-- Input Area -->
        <div class="flex gap-2">
            <input type="text" id="user-input" placeholder="សួរសំណួររបស់អ្នកនៅទីនេះ..." 
                   class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500">
            <button onclick="sendMessage()" id="send-btn"
                    class="bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded-lg font-bold transition">ផ្ញើ</button>
        </div>
    </div>

    <script>
        const API_KEY = 'xai-7zTWbKQqNOkZe8FJMwf84sWmYAElxfRTXBKK4XQ7X1RedRSboYY262Ijz28NujEoKoI728kVL4UorMp8';
        const chatBox = document.getElementById('chat-box');

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const message = input.value.trim();
            if (!message) return;

            // បង្ហាញសំណួរអ្នកប្រើ
            addMessage('អ្នក', message, 'bg-blue-900');
            input.value = '';

            try {
                const response = await fetch("https://api.x.ai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${API_KEY}`
                    },
                    body: JSON.stringify({
                        model: "grok-beta",
                        messages: [{ role: "user", content: message }]
                    })
                });

                const data = await response.json();
                addMessage('Grok AI', data.choices[0].message.content, 'bg-slate-700');
            } catch (error) {
                addMessage('Error', 'មានបញ្ហាក្នុងការភ្ជាប់ជាមួយ AI', 'bg-red-900');
            }
        }

        function addMessage(sender, text, colorClass) {
            const div = document.createElement('div');
            div.className = `p-3 rounded-lg ${colorClass} max-w-[80%]`;
            div.innerHTML = `<strong class="block text-xs opacity-70">${sender}</strong> ${text}`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
